# =============================================================================
# Release Workflow
# =============================================================================
# Generated with AI assistance
# First prompt: "how to make a release with versioning and all that is needed 
#               for pushing to a branch via CI CD github. I already have a 
#               project on main setup. I only want the github action for 
#               making a new release on push"
# Date: February 3, 2026
# Model: Claude Opus 4.5
# =============================================================================

name: release
on:
  workflow_dispatch:
    inputs:
      skip_editor:
        description: 'Skip the editor build (faster; produces a zip with just game.exe)'
        type: boolean
        default: false
      test_mode:
        description: 'Test run: tag as test-<sha>, mark prerelease, no version bump'
        type: boolean
        default: false
  push:
    branches:
      - main
jobs:
  version:
    name: Get Version
    runs-on: ubuntu-latest
    outputs:
      new_version: ${{ steps.version.outputs.new_version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Get latest release
        id: version
        run: |
          # Test mode: skip the version bump entirely and tag the
          # release with the short commit SHA. Keeps your v0.0.X
          # sequence clean while still giving the release a unique tag.
          if [ "${{ inputs.test_mode }}" = "true" ]; then
            SHORT_SHA=$(git rev-parse --short HEAD)
            NEW_VERSION="test-${SHORT_SHA}"
            echo "🧪 Test mode: using tag $NEW_VERSION (no version bump)"
            echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Normal path: bump the patch number off the latest release.
          CURRENT_VERSION=$(gh release view --json tagName -q .tagName)
          echo "📌 Current version: $CURRENT_VERSION"

          VERSION_NUMBER=${CURRENT_VERSION#v}
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION_NUMBER"

          NEW_PATCH=$((PATCH + 1))
          NEW_VERSION="v$MAJOR.$MINOR.$NEW_PATCH"

          echo "🚀 New version will be: $NEW_VERSION"
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ github.token }}

  build-editor:
    name: Build Developer-Packaging
    # Skipped when workflow_dispatch is run with skip_editor=true.
    # On a push event, `inputs` is null, so !inputs.skip_editor is true
    # and the job runs as normal.
    if: ${{ !inputs.skip_editor }}
    needs: version
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
      - name: Configure
        shell: pwsh
        run: cmake --preset Developer-Packaging -DCMAKE_UNITY_BUILD=ON -DBUILD_VERSION="${{ needs.version.outputs.new_version }}"
      - name: Build
        shell: pwsh
        run: cmake --build --preset Developer-Packaging --target game -j
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: editor-build
          path: build/Developer-Packaging/bin/game/*

  build-game:
    name: Build Release-Game
    needs: version
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
      - name: Configure
        shell: pwsh
        # No THERMITE_DEVELOPER_BUILD flag here — we want the Steam
        # exe to be minimal (just the binary). Assets are assembled
        # separately from the engine folder in the dev zip + P4.
        run: cmake --preset Release-Game -DCMAKE_UNITY_BUILD=ON -DBUILD_VERSION="${{ needs.version.outputs.new_version }}"
      - name: Build
        shell: pwsh
        run: cmake --build --preset Release-Game --target game -j

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: game-build
          path: build/Release-Game/bin/game/game.exe

  release:
    name: Create Release
    needs: [ version, build-editor, build-game ]
    # `needs` normally cascades skips: if build-editor is skipped, this
    # job is too. We override that — run release as long as nothing
    # actually FAILED or was cancelled. `always()` forces evaluation
    # even when an upstream job was skipped.
    if: |
      always() &&
      needs.version.result == 'success' &&
      needs.build-game.result == 'success' &&
      (needs.build-editor.result == 'success' || needs.build-editor.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # --- Downloads: always grab the Release-Game exe, grab the
      # --- editor build only when it actually ran.
      - name: Download editor artifact
        if: ${{ !inputs.skip_editor }}
        uses: actions/download-artifact@v4
        with:
          name: editor-build
          path: release-package
      - name: Download game artifact
        uses: actions/download-artifact@v4
        with:
          name: game-build
          path: release-package

      - name: Package build
        run: |
          cd release-package
          zip -r ../thermite-Developer-Packaging.zip .
          cd ..
          ls -lh thermite-*.zip

      - name: Generate changelog
        id: changelog
        run: |
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -z "$LATEST_TAG" ]; then
            CHANGES=$(git log --pretty=format:"- %s" HEAD | grep -iE "^- (feat|fix|breaking|docs|chore):" | head -20)
          else
            CHANGES=$(git log --pretty=format:"- %s" ${LATEST_TAG}..HEAD | grep -iE "^- (feat|fix|breaking|docs|chore):" | head -20)
          fi
          [ -z "$CHANGES" ] && CHANGES="- New Update just dropped!"
          echo "changes<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.new_version }}
          name: Release ${{ needs.version.outputs.new_version }}
          body: |
            ## What's Changed
            ${{ steps.changelog.outputs.changes }}
          files: thermite-Developer-Packaging.zip
          draft: false
          # In test mode, publish as prerelease so it doesn't show up
          # as the "latest" release to anything pulling from main.
          prerelease: ${{ inputs.test_mode == true }}