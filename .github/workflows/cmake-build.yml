name: build
on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

jobs:
  build:
    name: "Build ${{ matrix.preset }}"
    strategy:
      matrix:
        preset: 
          - Debug-Editor
          - Release-Editor
          - Debug-Game
          - Release-Game
    runs-on: windows-latest
    env:
      SCCACHE_GHA_ENABLED: "true"
      # Normalize paths for cache hits across runners
      SCCACHE_BASEDIRS: ${{ github.workspace }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
      
      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
      
      - name: Configure with preset
        shell: pwsh
        run: |
          cmake --preset ${{ matrix.preset }} -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache -DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded
      
      - name: Build with preset
        shell: pwsh
        run: |
          cmake --build --preset ${{ matrix.preset }} -j
      - name: Run sccache stat for check
        shell: bash
        run: ${SCCACHE_PATH} --show-stats
        
  cpp-linter-windows:
    name: "Run cpp-linter (Windows)"
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
      
      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
      
      - name: Generate compile_commands.json
        shell: pwsh
        run: |
          cmake --preset Debug-Editor
      
      - name: Copy compile_commands.json
        shell: pwsh
        run: |
          Copy-Item "build/Debug-Editor/compile_commands.json" "compile_commands.json" -Force
      
      - name: Upload compile_commands.json (Windows)
        uses: actions/upload-artifact@v4
        with:
          name: compile-commands-windows
          path: compile_commands.json
          retention-days: 7
      
      - name: Run cpp-linter
        uses: cpp-linter/cpp-linter-action@main
        id: linter
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          ignore: '.github | extern | build | tests | pch.hpp | const.hpp'
          style: file
          files-changed-only: true
          step-summary: true
          thread-comments: true
          tidy-checks: ''
          
  test:
    name: "Test ${{ matrix.preset }}"
    strategy:
      matrix:
        include:
          - preset: Debug-Game
    runs-on: windows-latest
    env:
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_BASEDIRS: ${{ github.workspace }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.9
      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
      
      
      - name: Cache FetchContent downloads
        uses: actions/cache@v4
        with:
          path: build/${{ matrix.preset }}
          key: test-${{ runner.os }}-${{ matrix.preset }}-${{ hashFiles('**/CMakeLists.txt', 'CMakePresets.json') }}
          restore-keys: |
            test-${{ runner.os }}-${{ matrix.preset }}-
      - name: Configure with tests enabled
        shell: pwsh
        run: |
          cmake --preset ${{ matrix.preset }} -DTHERMITE_BUILD_TESTS=ON -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache -DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded
      
      
      - name: Build with tests
        shell: pwsh
        run: |
          cmake --build --preset ${{ matrix.preset }} -j --target UnitTests
      
      - name: Run tests
        shell: pwsh
        run: |
          ./build/${{ matrix.preset }}/bin/UnitTests