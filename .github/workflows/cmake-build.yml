name: build

on:
  pull_request:
    branches: 'main'

jobs:
  build:
    name: "Build ${{ matrix.preset }}"
    strategy:
      matrix:
        preset: 
          - Debug-Editor
          - Release-Editor
          - RelWithDebInfo-Editor
          - Debug-Game
          - Release-Game
          - RelWithDebInfo-Game
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Vulkan SDK
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          vulkan_version: 1.4.328.1
          install_runtime: false
          cache: true
          stripdown: true
      
      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
      
      - name: Configure with preset
        shell: pwsh
        run: |
          cmake --preset ${{ matrix.preset }}
      
      - name: Build with preset
        shell: pwsh
        run: |
          cmake --build --preset ${{ matrix.preset }} -j
  
  cpp-linter-windows:
    name: "Run cpp-linter (Windows)"
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
      
      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
      
      - name: Generate compile_commands.json
        shell: pwsh
        run: |
          cmake --preset Debug-Editor
      
      - name: Copy compile_commands.json
        shell: pwsh
        run: |
          Copy-Item "build/Debug-Editor/compile_commands.json" "compile_commands.json" -Force
      
      - name: Upload compile_commands.json (Windows)
        uses: actions/upload-artifact@v4
        with:
          name: compile-commands-windows
          path: compile_commands.json
          retention-days: 7
      
      - name: Run cpp-linter
        uses: cpp-linter/cpp-linter-action@main
        id: linter
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          ignore: '.github | extern | build | tests | pch.hpp'
          style: file
          files-changed-only: true
          step-summary: true
          thread-comments: true
          tidy-checks: ''
          
  test:
    name: "Test ${{ matrix.preset }}"
    strategy:
      matrix:
        include:
          - preset: Debug-Editor
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Vulkan SDK
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          vulkan_version: 1.4.328.1
          install_runtime: false
          cache: true
          stripdown: true
      
      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
      
      - name: Configure with tests enabled
        shell: pwsh
        run: |
          cmake --preset ${{ matrix.preset }} -DTHERMITE_BUILD_TESTS=ON
      
      - name: Build with tests
        shell: pwsh
        run: |
          cmake --build --preset ${{ matrix.preset }} -j --target UnitTests
      
      - name: Run tests
        shell: pwsh
        run: |
          ./build/${{ matrix.preset }}/bin/UnitTests
